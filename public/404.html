<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Wiki</title>
  <script>
    // GitHub Pages SPA fallback: refreshing a deep link such as /post/xyz hits 404
    // on GitHub Pages. Forward it back into the app (index.html#!<path>) without
    // losing the URL; App.tsx restores the route from the hash.
    (function () {
      var path = window.location.pathname || '/';
      window.location.replace('/index.html#!' + path);
    })();
  </script>
</head>

</html>
